# AI HelpDesk suite. Unlike aws/ecs/k8s this suite needs NO infra/tenant
# lifecycle — `lifecycle: false` makes test_integration.yml skip the
# lifecycle pytest run and the teardown job, so no infra is created.
#
# The target GHA environment provides either a helpdesk-enabled portal
# (DUPLO_HOST/DUPLO_TOKEN) or a standalone helpdesk via the
# DUPLO_HELPDESK_HOST var and DUPLO_HELPDESK_TOKEN secret. Tests skip
# themselves (helpdesk_ready fixture) when neither is reachable.
#
# Run locally:
#   pytest src -m "integration and helpdesk" --ignore=src/tests/test_portal.py
infra_type: duplo
lifecycle: false
jobs:
- name: helpdesk
  markers: "integration and helpdesk"
