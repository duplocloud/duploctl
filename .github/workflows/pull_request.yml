name: Pull Request

on:
  pull_request:
    branches:
    - main
permissions:
  contents: read
jobs:

  prerequisites:
    name: Prerequisites
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Auto Assign
      uses: kentaro-m/auto-assign-action@v2.0.2
      with:
        configuration-path: .github/assign.yml
    - name: Make sure Changleog is updated
      uses: tarides/changelog-check-action@v4
      with:
        changelog: CHANGELOG.md

  # The scanners (quality.yml) run on their own pull_request trigger.
  lint:
    name: Test
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read
    secrets:
      GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
    with:
      push: false

  unit_test:
    name: Test
    uses: $/.github/workflows/test_unit.yml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      GH_APP_KEY: ${{ secrets.GH_APP_KEY }}

  docs_check:
    name: Documentation Check
    runs-on: ubuntu-26.04
    steps:
    - name: Setup
      id: setup
      uses: $/.github/actions/setup
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        install: ".[build,docs,sdk]"
        app-id: ${{ vars.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        submodules: "true"

    - name: Generated Docs Folder
      run: |
        mkdir -p dist dist/docs

    - name: Build Docs
      run: mkdocs build
