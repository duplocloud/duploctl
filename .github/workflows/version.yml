name: Bump Version

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to take'
        required: true
        default: 'patch'
        type: choice
        options:
        - 'patch'
        - 'minor'
        - 'major'
      push:
        description: 'Push changes to remote'
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      action:
        description: 'Action to take'
        default: 'patch'
        type: string
      push:
        description: 'Push changes to remote'
        default: false
        type: boolean
    outputs:
      tag: 
        value: ${{ jobs.version.outputs.tag }}
      version: 
        value: ${{ jobs.version.outputs.version }}
    secrets:
      GH_APP_KEY:
        description: GitHub App private key
        required: true

permissions:
  contents: read

jobs:
  version:
    name: Bump
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:

    - name: Setup
      id: setup
      uses: $/.github/actions/setup
      with:
        install: ".[build]"
        fetch-depth: 0
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        submodules: "true"
        # the version bump is committed and tagged through the API
        contents: write

    - name: Bump Version
      id: bump
      env:
        ACTION: ${{ inputs.action }}
        PUSH: ${{ inputs.push }}
        TOKEN: ${{ steps.setup.outputs.token }}
      run: >-
        ./scripts/version.py
        --action "$ACTION"
        --push "$PUSH"
        --token "$TOKEN"

    - name: Name Notes Artifact
      id: notes
      env:
        TAG: ${{ steps.bump.outputs.tag }}
      run: echo "name=notes-${TAG//\//-}" >> "$GITHUB_OUTPUT"

    - name: Upload Notes
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.notes.outputs.name }}
        path: dist/notes.md
