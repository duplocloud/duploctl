name: Releaser

on:
  workflow_dispatch:
    inputs:
      push:
        description: Should this push a new release? 
        required: false
        default: false
        type: boolean
      tag:
        description: Tag to release
        required: false
        type: string
      version:
        description: The true version of the package
        required: false
        type: string
  workflow_call:
    inputs:
      push:
        description: Should this push a new release? 
        required: false
        default: false
        type: boolean
      tag:
        description: Tag to release
        required: false
        type: string
    secrets:
      GH_APP_KEY:
        description: GitHub App private key
        required: true
      SLACK_BOT_TOKEN:
        description: Slack bot token for the release announcement
        required: false

permissions:
  contents: read

jobs:
  releaser:
    runs-on: ubuntu-latest
    permissions:
      # creates the GitHub release and uploads its assets
      contents: write
    steps:

    - name: Dist Dir
      id: dist_dir
      run: mkdir -p dist artifacts artifacts/installer

    - name: Get Tag Name
      id: info
      env:
        GIT_TAG: ${{ inputs.tag }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |
        if [ -z "$GIT_TAG" ]; then
          GIT_TAG=${GITHUB_REF#refs/*/}
        fi
        GIT_TAG="${GIT_TAG//\//-}"
        VERSION=$(echo $GIT_TAG | cut -d'v' -f2)
        NAME="duploctl-${VERSION}"
        PACKAGE_NAME="duplocloud_client-${VERSION}"
        RELEASE_URL="${REPO_URL}/releases/download/${GIT_TAG}"
        echo "NOTES_ARTIFACT=notes-${GIT_TAG//\//-}" >> $GITHUB_OUTPUT
        echo "GIT_TAG=${GIT_TAG}" >> $GITHUB_OUTPUT
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "NAME=${NAME}" >> $GITHUB_OUTPUT
        echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
        echo "RELEASE_URL=${RELEASE_URL}" >> $GITHUB_OUTPUT
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_OUTPUT
    
    - name: Download Installer Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ steps.info.outputs.NAME }}-*
        path: artifacts/installer
        merge-multiple: false

    - name: Download Package Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: duplocloud_client-*
        path: artifacts

    - name: Download Notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ steps.info.outputs.NOTES_ARTIFACT }}
        path: ${{ steps.info.outputs.NOTES_ARTIFACT }}

    # The release body is written to a file rather than GITHUB_ENV, where a
    # notes line matching the heredoc delimiter could inject variables.
    - name: Prep Notes
      env:
        NOTES_ARTIFACT: ${{ steps.info.outputs.NOTES_ARTIFACT }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BADGE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/publish.yml/badge.svg
      run: |
        {
          echo
          echo "[![Publish](${BADGE_URL})](${RUN_URL})"
          echo
          cat "${NOTES_ARTIFACT}/notes.md"
        } > release-body.md

    - name: Stage Release Package
      shell: bash
      env:
        PACKAGE_NAME: ${{ steps.info.outputs.PACKAGE_NAME }}
      run: |
        package="$(find artifacts -type f -name "duplocloud_client-*.tar.gz")"
        echo "Staging Package $package"
        pkg_name="$(basename $package)"
        cp "$package" "dist/${pkg_name}"
    
    - name: Stage Release Plugins
      shell: bash
      run: |
        plugins="$(find artifacts -type f -name "duploctl_*-*.tar.gz")"
        echo "Staging Plugins $plugins"
        for plugin in $plugins; do
          plugin_name="$(basename $plugin)"
          echo " -- plugin $plugin_name"
          cp "$plugin" "dist/${plugin_name}"
        done

    - name: Stage Binaries
      id: stage_binaries
      run: |
        echo "Staging Binaries"
        ls -l artifacts/installer
        for d in artifacts/installer/*; do
          name=$(basename $d)
          dest="dist/${name}.tar.gz"
          echo " -- binary $name"
          tar -czvf "$dest" -C $d .
        done

    - name: Stamp the Checksums
      id: checksums
      run: >-
        find dist 
        -type f 
        -name "*.tar.gz" 
        -execdir shasum -a 256 {} \; >> dist/checksums.txt
        
    - name: Preview Distribution
      run: ls -l dist

    - name: Create Release
      id: release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      if: inputs.push == true
      with:
        name: ${{ steps.info.outputs.GIT_TAG }}
        tag_name: ${{ steps.info.outputs.GIT_TAG }}
        prerelease: false
        files: |
          dist/*
        body_path: release-body.md

    - name: Post to a Slack channel
      id: slack
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      if: inputs.push == true
      with:
        method: chat.postMessage
        token: ${{ secrets.SLACK_BOT_TOKEN }}
        payload: |
          channel: ${{ vars.SLACK_CHANNEL_ID }}
          text: |
            duploctl ${{ steps.info.outputs.GIT_TAG }} is out!
            ${{ steps.release.outputs.url }}

    - name: Job Summary
      env:
        GIT_TAG: ${{ steps.info.outputs.GIT_TAG }}
        URL: ${{ steps.release.outputs.url }}
        VERSION: ${{ steps.info.outputs.VERSION }}
      run: |
        cat <<EOF >> $GITHUB_STEP_SUMMARY
        Tag: $GIT_TAG
        Release: $URL
        Docker: duplocloud/duploctl:${GIT_TAG}
        PyPi: duplocloud-client==${VERSION}
        EOF
    
