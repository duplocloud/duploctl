name: Publish Docs

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push site to Github Pages?
        required: false
        default: false
        type: boolean
      tag:
        description: Ref to build docs from?
        required: false
        type: string
  workflow_call:
    inputs:
      push:
        description: Push site to Github Pages?
        required: false
        default: true
        type: boolean
      tag:
        description: Ref to build docs from?
        required: true
        type: string
    secrets:
      GH_APP_KEY:
        description: GitHub App private key
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:

    - name: Setup
      id: setup
      uses: $/.github/actions/setup
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0
        install: ".[build,docs,sdk]"
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        submodules: "true"

    - name: Generated Docs Folder
      run: |
        mkdir -p dist dist/docs

    - name: Build Docs
      run: mkdocs build
      env:
        # link rewritten repo urls at the ref the site is built from
        DOCS_REF: ${{ inputs.tag }}

    - name: Fix permissions
      run: |
        chmod -c -R +rX "dist/site/" | while read line; do
          echo "::warning title=Invalid file permissions automatically fixed::$line"
        done

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: dist/site

  deploy:
    name: Deploy
    runs-on: ubuntu-26.04
    needs: build
    if: inputs.push
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
