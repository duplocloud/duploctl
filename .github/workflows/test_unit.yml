name: Unit Tests

on:
  workflow_dispatch: {}
  workflow_call: 
    secrets:
      GH_APP_KEY:
        description: GitHub App private key. Absent on pull requests from a fork.
        required: false

permissions:
  contents: read

jobs:
  unit_test:
    name: Unit
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:

    - name: Setup
      id: setup
      uses: $/.github/actions/setup
      with:
        install: ".[build,test,sdk] plugins/aws/"
        python-version: ${{ matrix.python-version }}
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
    
    - name: Test with pytest
      run: >-
        pytest src 
        --cov-report=xml:dist/coverage.xml
        --junit-xml=dist/test-results.xml 
        -m unit

    - name: Pytest Summary Report
      if: always() && matrix.python-version == vars.PY_VERSION
      uses: pmeier/pytest-results-action@v0.9.0
      with:
        path: dist/test-results.xml
        summary: true
        display-options: fEX
        fail-on-empty: true

    # a pull request from a fork runs with a read-only token, so the comment
    # this posts is not permitted there and must not fail the test job.
    # The job token posts it; the App token is minted read-only.
    - name: Pytest Coverage Report
      if: always() && matrix.python-version == vars.PY_VERSION
      continue-on-error: true
      uses: orgoro/coverage@v3.3.1
      with:
        coverageFile: dist/coverage.xml
        token: ${{ github.token }}
