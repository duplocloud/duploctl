# OpenSSF Scorecard: grades the repository's supply-chain security posture
# (branch protection, pinned dependencies, token permissions, signed
# releases, ...) and reports each failing check to code scanning.
# https://github.com/ossf/scorecard-action
#
# Publishing results restricts this workflow to the approved actions below
# and forbids top-level env or defaults, so it stays standalone.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
  - cron: "41 6 * * 1"
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-26.04
    permissions:
      # upload the results to code scanning
      security-events: write
      # publish the results to the public Scorecard API and badge
      id-token: write
    steps:

    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Run Scorecard
      uses: ossf/scorecard-action@v2.5.0
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true

    - name: Save Sarif File
      uses: actions/upload-artifact@v7
      with:
        name: scorecard-sarif
        path: results.sarif
        retention-days: 5

    - name: Upload to Code Scanning
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif
