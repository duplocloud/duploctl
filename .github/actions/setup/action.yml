name: Setup
description: Setup the environment for the release
inputs:
  ref:
    description: The git ref to build on
    required: false
  fetch-depth:
    description: The depth of the git checkout
    required: false
  fetch-tags: 
    description: Whether to fetch tags
    required: false
  install:
    description: Arguments to pass to the pip install
    required: false
  python-version:
    description: The python version to use
    required: false
    default: "3.13"
  app-id:
    description: The GitHub App ID. Omitted on pull requests from a fork, where secrets are not available.
    required: false
  private-key:
    description: The GitHub token to use. Omitted on pull requests from a fork, where secrets are not available.
    required: false
  repositories:
    description: The repositories to get tokens for.
    required: false
    default: duploctl
  submodules:
    description: Whether to fetch submodules
    required: false
    default: "false"
outputs:
  token:
    description: The GitHub App token, or the default job token when the App credentials are unavailable
    value: ${{ steps.app-token.outputs.token || github.token }}
runs:
  using: "composite"
  steps:

  # A pull request from a fork gets no secrets, so private-key is empty and
  # the App token cannot be minted. The repo and its wiki submodule are both
  # public, so the default job token is enough to check out and build; it is
  # only short of the cross-repo access the App grants.
  - name: Create GitHub App Token
    uses: actions/create-github-app-token@v2
    id: app-token
    if: inputs.app-id != '' && inputs.private-key != ''
    with:
      app-id: ${{ inputs.app-id }}
      private-key: ${{ inputs.private-key }}
      repositories: ${{ inputs.repositories }}

  - name: Checkout Code
    uses: actions/checkout@v6
    with:
      ref: ${{ inputs.ref }}
      fetch-depth: ${{ inputs.fetch-depth }}
      fetch-tags: ${{ inputs.fetch-tags }}
      token: ${{ steps.app-token.outputs.token || github.token }}
      submodules: ${{ inputs.submodules }}

  - name: Set up Python ${{ inputs.python-version }}
    uses: actions/setup-python@v6
    if: inputs.install
    with:
      python-version: ${{ inputs.python-version }}
      cache: pip

  - name: Install Dependencies
    if: inputs.install
    shell: bash
    run: pip install ${{ inputs.install }}
