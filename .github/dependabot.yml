# Dependabot version updates. Security updates are enabled in the repository
# settings and are not subject to the cooldown below.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# The cooldown holds back brand-new releases for a few days, which is the
# window in which hijacked or malicious package and action versions are
# usually caught and yanked. Minor and patch updates are grouped per
# ecosystem; majors stay separate for review.

version: 2
updates:

# Floors in pyproject.toml are only raised when a release requires it; the
# ranges are open, so CI and fresh installs already resolve the latest.
- package-ecosystem: pip
  directories:
  - /
  - /plugins/aws
  schedule:
    interval: weekly
  versioning-strategy: increase-if-necessary
  cooldown:
    default-days: 7
  groups:
    pip-minor-patch:
      update-types:
      - minor
      - patch

# Actions are on release tags (see .github/zizmor.yml). A floating major
# already takes patches, so this mostly moves majors and exact tags.
- package-ecosystem: github-actions
  directories:
  - /
  - /.github/actions/*
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch

- package-ecosystem: devcontainers
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
